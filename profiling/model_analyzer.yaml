model_repository: /models
triton_launch_mode: local
triton_server_path: /opt/tritonserver/bin/tritonserver
perf_analyzer_path: /opt/triton-sdk/bin/perf_analyzer
checkpoint_directory: /results/model_analyzer/checkpoints
output_model_repository_path: /results/model_analyzer/model_repository
export_path: /results/model_analyzer
triton_output_path: /results/model_analyzer/triton.log
run_config_search_disable: true
# Model Analyzer 1.35.0 uses profile_models.mobilenet.cpu_only for CPU profiling.
# dcgm_disable belongs to newer releases and is not accepted by this version.
collect_cpu_metrics: true
client_protocol: http
batch_sizes: [1]
concurrency: [1, 2, 4, 8, 16]
perf_analyzer_flags:
  measurement-interval: 15000
  stability-percentage: 10
  max-trials: 20
triton_server_flags:
  allow_gpu_metrics: false
  strict_model_config: true
num_configs_per_model: 3
objectives:
  - perf_throughput
inference_output_fields:
  - model_name
  - model_config_path
  - instance_group
  - max_batch_size
  - batch_size
  - concurrency
  - perf_throughput
  - perf_latency_avg
  - perf_latency_p99
profile_models:
  mobilenet:
    cpu_only: true
    model_config_parameters:
      max_batch_size: [1, 4, 8]
      dynamic_batching:
        max_queue_delay_microseconds: [0, 1000]
      instance_group:
        - kind: KIND_CPU
          count: [1, 2]
