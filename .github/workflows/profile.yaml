name: Triton CPU profiling

'on':
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: triton-cpu-profiling
  cancel-in-progress: false

jobs:
  profile:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      COMPOSE_PROJECT_NAME: hw3-ci
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Prepare disk and record hardware
        shell: bash
        run: |
          # These tools are unnecessary on this disposable hosted runner.
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          mkdir -p results/checks
          {
            date -u
            uname -a
            lscpu
            free -h
            df -h /
          } > results/runner.txt
          python3 - <<'PY'
          import shutil
          free = shutil.disk_usage('.').free / 2**30
          print(f'Free disk space: {free:.1f} GiB')
          if free < 30:
              raise SystemExit('At least 30 GiB free required for Triton images and builds')
          PY

      - name: Check registry images
        shell: bash
        run: |
          docker manifest inspect nvcr.io/nvidia/tritonserver:23.12-py3 > /dev/null
          docker manifest inspect nvcr.io/nvidia/tritonserver:23.12-py3-sdk > /dev/null

      - name: Run inference checks and both analyzers
        shell: bash
        run: bash scripts/run_all.sh 2>&1 | tee results/run.log

      - name: Render Performance Analyzer table
        shell: bash
        run: |
          python3 scripts/perf_report.py results/perf_analyzer/baseline > results/performance.md
          cat results/performance.md >> "$GITHUB_STEP_SUMMARY"

      - name: Collect reports and configuration files
        if: always()
        shell: bash
        run: |
          mkdir -p results/checks
          docker compose logs --no-color triton > results/checks/triton-final.log 2>&1 || true
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          source = Path('results/model_analyzer/model_repository')
          for config in source.rglob('config.pbtxt'):
              destination = Path('results/configurations') / config.relative_to(source)
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(config, destination)
          PY
          tar --exclude='results/model_analyzer/model_repository' \
            -czf profiling-results.tar.gz results

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: triton-cpu-results-${{ github.run_id }}
          path: profiling-results.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Stop containers
        if: always()
        run: docker compose --profile tools down
